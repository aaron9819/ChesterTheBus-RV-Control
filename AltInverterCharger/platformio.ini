; PlatformIO Project Configuration File
;
; AltInverterCharger - ESP32-S2 Mini
; Inverter on/off relay pulse + battery voltage monitoring
;
; First flash MUST be over USB (leave the OTA lines commented out).
; After the first flash, uncomment the upload_protocol/upload_port/upload_flags
; lines below to upload over the air.

[platformio]
; Build output and downloaded libraries go in .pio.nosync instead of .pio. The
; repo lives on an iCloud-synced Desktop; the ".nosync" suffix keeps iCloud from
; syncing PlatformIO's churn, which was dropping "name 2.cpp" conflict copies into
; the library folders and breaking builds.
workspace_dir = .pio.nosync
; WiFi and OTA credentials: ../secrets.ini (gitignored; template secrets.example.ini)
extra_configs = ../secrets.ini

[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino
; Shared network setup (stored WiFi/MQTT settings, setup hotspot, browser updates)
lib_extra_dirs = ../lib_shared
build_flags =
    -D BUILD_TIMESTAMP="$UNIX_TIME"
    -D BUILD_DATE=__DATE__
    -D BUILD_TIME=__TIME__
    '-D SECRET_WIFI_SSID="${secrets.wifi_ssid}"'
    '-D SECRET_WIFI_PASSWORD="${secrets.wifi_password}"'
    '-D SECRET_OTA_PASSWORD="${secrets.ota_password}"'

lib_deps =
	knolleary/PubSubClient@^2.8
	paulstoffregen/OneWire@^2.3.7
	milesburton/DallasTemperature@^3.11.0
monitor_speed = 115200

;Uncomment these lines after the first USB flash to use OTA upload
upload_protocol = espota
upload_port = AltInverterCharger.local
upload_flags =
   --auth=${secrets.ota_upload_password}
   --port=3232
