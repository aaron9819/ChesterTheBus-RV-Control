; Credentials for every firmware project in this repo.
;
; Copy this file to secrets.ini (same folder, gitignored) and fill it in. Each
; project's platformio.ini loads it with extra_configs: the values are compiled
; into the firmware as SECRET_* defines, and ota_upload_password is what
; `pio run -t upload` authenticates with.
[secrets]
wifi_ssid = your-ssid
wifi_password = your-wifi-password

; OTA password compiled INTO the firmware - what boards require after this build
ota_password = your-ota-password

; OTA password the boards CURRENTLY require, used by `pio run -t upload`.
; Same as ota_password, except while rotating it: a board running older firmware
; still expects the old one until it has been flashed once.
ota_upload_password = your-ota-password
